version: 2

models:
  - name: stg_employees
    description: "Cleaned and standardized employee records."

    columns:
      - name: employee_id
        description: "Unique identifier for each employee."
        data_tests:
          - unique
          - not_null

      - name: first_name
        data_tests:
          - not_null

      - name: last_name
        data_tests:
          - not_null

      - name: department
        data_tests:
          - not_null

      - name: salary
        data_tests:
          - not_null

  - name: employees_by_department
    description: "Aggregated employee and salary metrics by department."

    columns:
      - name: department
        data_tests:
          - unique
          - not_null

      - name: employee_count
        data_tests:
          - not_null

      - name: average_salary
        data_tests:
          - not_null

      - name: total_salary
        data_tests:
          - not_null
